name: release

# Os três atos do ciclo, e nenhum deles cria tag na máquina de ninguém ou
# reconstrói uma imagem durante a release.
#
#   1. VOCÊ dispara "Run workflow" → ele lê `.changes/`, calcula o número, monta
#      a seção do CHANGELOG e abre um PR de release em português dizendo o que
#      vai sair. Nada é publicado ainda.
#   2. VOCÊ faz merge desse PR → ele aguarda `imagens-ok` desse commit e cria a
#      tag Git `vX.Y.Z` na main somente depois da validação.
#   3. O push da tag promove o trio `sha-<commit>` já validado para `vX.Y.Z`,
#      valida o conjunto, move `stable` com rollback compensatório e só então
#      publica a GitHub Release.
#
# Quem escreve (branch, PR, tag) é o token de um GitHub App, NUNCA o
# GITHUB_TOKEN. A razão é uma armadilha documentada pelo próprio GitHub: evento
# disparado com o GITHUB_TOKEN não cria novo workflow run. Se a tag nascesse
# dele, o job de promoção jamais rodaria — a tag existiria sem SemVer, sem
# `stable` e sem GitHub Release. Falha silenciosa, descoberta só quando alguém
# tentasse atualizar.
#
# Por isso a tag nasce com o App. A promoção usa o GITHUB_TOKEN com `packages:
# write`, sem PAT novo, e nunca chama o workflow de build da main.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    tags: ["v*"]

# O default é somente leitura. A promoção recebe `packages: write` para mover
# manifests e `contents: write` para criar a GitHub Release no menor escopo.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}
  IMAGE_SOURCE: https://github.com/soupromidia/BB-Gestao

jobs:
  abrir-pr-de-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Resolver identidade Git do App
        id: app-identity
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          set -euo pipefail
          [ -n "${APP_SLUG}" ] || { echo "::error::O App autenticado não informou app-slug"; exit 1; }
          bot_user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          [[ "${bot_user_id}" =~ ^[0-9]+$ ]] || { echo "::error::ID numérico do bot não resolvido"; exit 1; }
          bot_name="${APP_SLUG}[bot]"
          echo "name=${bot_name}" >> "${GITHUB_OUTPUT}"
          echo "email=${bot_user_id}+${bot_name}@users.noreply.github.com" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v7
        with:
          # `fetch-depth: 0` porque o corte compara com as tags, e o checkout
          # raso padrão não traz nenhuma.
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - uses: ./.github/actions/preparar-node
        # O teto do preâmbulo mora aqui porque passo de composite action não
        # aceita `timeout-minutes`. Razão e medições: o cabeçalho da action.
        timeout-minutes: 5

      - name: Calcular o número e montar a seção
        id: corte
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/cortar-release.ts --escrever | tee /tmp/corte.txt
          versao=$(pnpm exec tsx scripts/cortar-release.ts --versao-do-changelog)
          echo "versao=${versao}" >> "$GITHUB_OUTPUT"

      - name: Abrir o PR
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VERSAO: ${{ steps.corte.outputs.versao }}
          BOT_NAME: ${{ steps.app-identity.outputs.name }}
          BOT_EMAIL: ${{ steps.app-identity.outputs.email }}
        run: |
          set -euo pipefail
          git config user.name  "${BOT_NAME}"
          git config user.email "${BOT_EMAIL}"
          git checkout -b "release/${VERSAO}"
          git add CHANGELOG.md .changes
          git commit -m "release(${VERSAO}): a versão montada a partir dos fragmentos declarados"
          git push origin "release/${VERSAO}"
          {
            echo "Esta versão sai como **${VERSAO}**, e o número foi CALCULADO a partir do que cada PR declarou — ninguém digitou."
            echo
            echo '```'
            cat /tmp/corte.txt
            echo '```'
            echo
            echo "Ao fazer merge deste PR, a tag \`v${VERSAO}\` é criada automaticamente e o trio SHA já validado é promovido sem rebuild."
            echo "Se algo aqui estiver errado, **feche o PR** em vez de editar o número: corrija o fragmento e dispare o workflow de novo."
          } > /tmp/corpo.md
          gh pr create --base main --head "release/${VERSAO}" \
            --title "Release ${VERSAO}" --body-file /tmp/corpo.md

  cortar-tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # A detecção de push comum usa somente o GITHUB_TOKEN read-only e não
          # deixa essa credencial persistida para um eventual push de tag.
          persist-credentials: false

      - uses: ./.github/actions/preparar-node
        # O teto do preâmbulo mora aqui porque passo de composite action não
        # aceita `timeout-minutes`. Razão e medições: o cabeçalho da action.
        timeout-minutes: 5

      - name: Este push foi um corte de release?
        id: pendente
        run: |
          set -euo pipefail

          # ─── O QUE IDENTIFICA UM CORTE DE RELEASE ─────────────────────────
          #
          # Só a primeira condição ("o CHANGELOG anuncia versão que não tem
          # tag") deixaria QUALQUER PR cortar a release: bastaria escrever
          # `## [1.7.0]` no CHANGELOG à mão e a tag nasceria no merge dele,
          # pulando o PR de release inteiro — e com ela as três imagens e o
          # canal `stable`. Não é hipótese: medido em 2026-08-27, o PR #354
          # (RAG) já trazia uma seção de versão escrita à mão no CHANGELOG.
          #
          # ⚠️ A SEGUNDA CONDIÇÃO ERA "O DIRETÓRIO FICOU VAZIO", E ISSO ESTAVA
          # ERRADO — issue #472, medido no run 33494815423:
          #
          #     fragmentos em .changes/: antes=4 depois=1
          #
          # A v1.11.1 foi anunciada no CHANGELOG e NUNCA virou tag. Sem tag,
          # sem release, sem as três imagens, sem `stable`: nenhuma VPS a
          # recebeu, e o workflow saiu `success` — ele só decidiu não cortar.
          #
          # A causa é uma CORRIDA, não uma forja: o PR #460 mergeou entre o
          # corte e o merge da release, deixando o fragmento dele vivo. O
          # branch de release foi cortado ANTES daquele fragmento existir,
          # então o merge apagou os 3 que consumiu e o 4º continuou lá.
          # "Esvaziou o diretório" é falso para todo corte que corre em
          # paralelo com um merge comum — e merge comum é o estado normal de
          # um repo vivo.
          #
          # A assinatura correta é REMOVER: PR comum ACRESCENTA fragmento e
          # nunca apaga; só o corte apaga. Conferido no commit real que
          # falhou (f6f91377): a guarda antiga via depois=1 e recusava; a
          # nova vê 3 removidos e corta.
          #
          # A identidade do autor é validada numa segunda fase, somente depois
          # que esta detecção estrutural concluir `cortar=sim`. Assim um push
          # comum não depende de variável ou secret do GitHub App.
          versao=$(pnpm exec tsx scripts/cortar-release.ts --versao-do-changelog)

          # `--diff-filter=D` conta o que este commit APAGOU de `.changes/`.
          # `|| true` porque `grep -c` sai 1 quando não casa nada, e `set -e`
          # mataria o passo justamente no caso normal (PR comum, zero removidos).
          removidos=$(git diff --diff-filter=D --name-only HEAD^ HEAD -- .changes/ | grep -c '\.md$' || true)

          # ─── O QUE SOBROU, E POR QUE ISSO IMPORTA ─────────────────────────
          #
          # A guarda antiga garantia, sem dizer, uma segunda coisa: `depois==0`
          # significava que a versão anunciada dá conta de TUDO que estava
          # pendente na main. Trocar por "removeu" abre mão disso — e há um caso
          # em que abrir mão FAZ DANO.
          #
          # O caso: um PR com `impacto: exige_acao` mergeia durante a janela da
          # release. O fragmento dele sobrevive (vai para a próxima versão), a
          # tag sai, e `stable` passa a apontar para uma main que EXIGE ação do
          # operador — enquanto a seção do CHANGELOG que ele lê antes de rodar o
          # `update.sh` diz que nada mudou. O aviso fica na gaveta e o contêiner
          # não sobe.
          #
          # `nada_mudou` e `capacidade_nova` sobrevivendo são inofensivos: entram
          # na versão seguinte e ninguém quebra no meio. `exige_acao` não é.
          exigem_acao=$(
            git diff --diff-filter=D --name-only HEAD^ HEAD -- .changes/ > /tmp/removidos.txt || true
            for f in $(git ls-tree -r --name-only HEAD -- .changes/ | grep '\.md$' || true); do
              if git show "HEAD:${f}" | head -20 | grep -q '^impacto:[[:space:]]*exige_acao'; then
                echo "${f}"
              fi
            done
            # Fecha a substituição com status conhecido, para que o `set -e` do
            # passo nunca dependa de qual foi o último `grep` do laço.
            true
          )

          if [ -z "${versao}" ]; then
            if [ "${removidos}" -gt 0 ]; then
              echo "::error::Este commit apagou ${removidos} fragmento(s), mas a linha Promidia não ganhou uma seção de release."
              echo "::error::Tag não criada: restaure os fragmentos ou faça o corte pelo workflow de release."
              exit 1
            fi
            echo "::notice::A linha Promidia ainda não tem seção de release; este é um push comum anterior ao primeiro corte."
            echo "cortar=nao" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "fragmentos removidos por este commit: ${removidos}"
          echo "fragmentos vivos que exigem ação: ${exigem_acao:-nenhum}"

          if git rev-parse -q --verify "refs/tags/v${versao}" >/dev/null; then
            echo "v${versao} já existe — nada a cortar"
            echo "cortar=nao" >> "$GITHUB_OUTPUT"
          elif [ "${removidos}" -eq 0 ]; then
            echo "::notice::O CHANGELOG anuncia ${versao} sem tag, mas este push não apagou fragmento nenhum."
            echo "::notice::Tag não criada. Uma release sai do workflow 'release' (Run workflow), nunca de um merge comum."
            echo "cortar=nao" >> "$GITHUB_OUTPUT"
          elif [ -n "${exigem_acao}" ]; then
            # Alto, e de novo não `notice`: este é o único caso em que NÃO cortar
            # é o certo, e ele precisa de gente. Cortar publicaria `stable` sem o
            # aviso que o operador precisa ler ANTES de atualizar.
            echo "::error::Sobrou fragmento com 'impacto: exige_acao' em .changes/ — a v${versao} sairia sem o aviso que o operador precisa ler antes de atualizar."
            echo "::error::Fragmentos: ${exigem_acao}"
            echo "::error::Tag NÃO criada. Rode o workflow de release de novo, agora que ele consome também esse fragmento."
            exit 1
          else
            echo "corte de release: ${removidos} fragmento(s) consumido(s), v${versao} ainda não existe"
            echo "cortar=sim"       >> "$GITHUB_OUTPUT"
            echo "versao=${versao}" >> "$GITHUB_OUTPUT"
          fi

      - name: Autenticar o App da Promidia para o corte
        if: steps.pendente.outputs.cortar == 'sim'
        uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Resolver identidade Git do App
        if: steps.pendente.outputs.cortar == 'sim'
        id: app-identity
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          set -euo pipefail
          [ -n "${APP_SLUG}" ] || { echo "::error::O App autenticado não informou app-slug"; exit 1; }
          bot_user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          [[ "${bot_user_id}" =~ ^[0-9]+$ ]] || { echo "::error::ID numérico do bot não resolvido"; exit 1; }
          bot_name="${APP_SLUG}[bot]"
          echo "name=${bot_name}" >> "${GITHUB_OUTPUT}"
          echo "email=${bot_user_id}+${bot_name}@users.noreply.github.com" >> "${GITHUB_OUTPUT}"

      - name: Preparar checkout para escrita pelo App
        if: steps.pendente.outputs.cortar == 'sim'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - name: Validar identidade do corte
        if: steps.pendente.outputs.cortar == 'sim'
        env:
          BOT_NAME: ${{ steps.app-identity.outputs.name }}
          VERSAO: ${{ steps.pendente.outputs.versao }}
        run: |
          set -euo pipefail

          # Num merge commit, HEAD^2 é a ponta do branch de release. Em squash,
          # o autor do próprio HEAD responde. O nome não é prova criptográfica;
          # ele preserva a guarda contra remoção acidental de fragmentos.
          assinante=$(git log -1 --format='%an' 'HEAD^2' 2>/dev/null || true)
          [ -n "${assinante}" ] || assinante=$(git log -1 --format='%an' HEAD)
          echo "assinante do corte: ${assinante}"
          echo "identidade esperada do App: ${BOT_NAME}"

          if [ "${assinante}" != "${BOT_NAME}" ]; then
            echo "::error::Este commit removeu fragmentos de .changes, mas não foi assinado pelo App autenticado (assinante: ${assinante})."
            echo "::error::A tag v${VERSAO} NÃO foi criada. Se isto foi um corte legítimo, ele não saiu do workflow 'release'."
            exit 1
          fi

      # O merge do PR dispara este workflow e publish-image.yml em paralelo.
      # A tag só pode nascer quando o artefato do MESMO commit já passou pela
      # matriz, smoke e validação remota que formam o check imagens-ok.
      - name: Aguardar imagens-ok do commit da release
        if: steps.pendente.outputs.cortar == 'sim'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            conclusao=$(
              gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs" \
                --jq '[.check_runs[] | select(.name == "imagens-ok")] | sort_by(.started_at) | last | .conclusion // ""' \
                2>/dev/null || true
            )
            case "${conclusao}" in
              success)
                echo "imagens-ok aprovou ${SHA}; a tag pode nascer"
                exit 0
                ;;
              failure|cancelled|timed_out|action_required|stale)
                echo "::error::imagens-ok terminou como ${conclusao} para ${SHA}; tag não criada"
                exit 1
                ;;
              *) sleep 30 ;;
            esac
          done
          echo "::error::imagens-ok não aprovou ${SHA} dentro de 30 minutos; tag não criada"
          exit 1

      - name: Criar e empurrar a tag
        if: steps.pendente.outputs.cortar == 'sim'
        env:
          VERSAO: ${{ steps.pendente.outputs.versao }}
          BOT_NAME: ${{ steps.app-identity.outputs.name }}
          BOT_EMAIL: ${{ steps.app-identity.outputs.email }}
        run: |
          set -euo pipefail
          git config user.name  "${BOT_NAME}"
          git config user.email "${BOT_EMAIL}"
          # Tag ANOTADA: guarda autor e data, e é o que `git describe
          # --exact-match` do agent.sh espera encontrar na VPS.
          git tag -a "v${VERSAO}" -m "v${VERSAO}"
          git push origin "v${VERSAO}"

  promover-release:
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    concurrency:
      group: promover-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/preparar-node
        timeout-minutes: 5

      - name: Set up Buildx para copiar manifests
        uses: docker/setup-buildx-action@v4

      - name: Autenticar no GHCR privado
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolver tag, commit e notas da release
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Tag inválida: ${TAG}; esperado vX.Y.Z"
            exit 1
          }
          release_version="${TAG}"
          changelog_version="${TAG#v}"
          sha=$(git rev-list -n 1 "${TAG}")
          [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Não foi possível resolver o commit completo de ${TAG}"
            exit 1
          }
          git merge-base --is-ancestor "${sha}" origin/main || {
            echo "::error::${TAG} aponta para ${sha}, que não pertence à main"
            exit 1
          }
          echo "version=${release_version}" >> "${GITHUB_OUTPUT}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

          VERSAO="${changelog_version}" pnpm exec tsx -e '
            import fs from "node:fs";
            import { extractChangelogSection } from "./lib/system/changelog";
            const v = process.env.VERSAO ?? "";
            const s = extractChangelogSection(fs.readFileSync("CHANGELOG.md", "utf8"), v);
            if (!s) { console.error(`seção [${v}] não achada no CHANGELOG`); process.exit(1); }
            const atencao = s.requiresAttention ? `### ⚠️ Requer atenção\n\n${s.requiresAttention}\n\n` : "";
            fs.writeFileSync("/tmp/notas.md", atencao + s.body);
          '

      - name: Promover e validar o trio sem rebuild
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: bash .github/scripts/promover-release.sh

      - name: Publicar a GitHub Release depois do trio stable
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} já existe; reutilizada."
          else
            gh release create "${TAG}" --title "${TAG}" --notes-file /tmp/notas.md
          fi
