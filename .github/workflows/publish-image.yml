name: Publicar imagens Docker (GHCR)

# Etapa 3 da distribuicao Promidia: a main publica somente o trio imutavel
# sha-<commit>. Pull requests e dispatch manual constroem e executam o smoke,
# mas nao publicam. SemVer e o canal stable pertencem a uma etapa posterior.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}
  IMAGE_SOURCE: https://github.com/soupromidia/BB-Gestao
  IMAGE_TAG: sha-${{ github.sha }}

concurrency:
  group: publish-images-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bb-gestao-app
            dockerfile: Dockerfile
            title: BB Gestão app
          - name: bb-gestao-worker
            dockerfile: Dockerfile.worker
            title: BB Gestão worker
          - name: bb-gestao-scheduler
            dockerfile: Dockerfile.scheduler
            title: BB Gestão scheduler
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Cada membro faz sua propria reserva logica. Em rerun, uma imagem valida
      # e reutilizada; ausencia permite um unico build; qualquer outro estado
      # falha fechado antes que o build-push-action possa mover a tag.
      - name: Verificar imagem SHA existente
        id: imagem-sha
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_REF: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}:${{ env.IMAGE_TAG }}
          EXPECTED_TITLE: ${{ matrix.title }}
        run: |
          set -euo pipefail
          saida=""
          if saida=$(docker pull --platform linux/amd64 "${IMAGE_REF}" 2>&1); then
            titulo=$(docker image inspect "${IMAGE_REF}" --format '{{ index .Config.Labels "org.opencontainers.image.title" }}')
            origem=$(docker image inspect "${IMAGE_REF}" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')
            revisao=$(docker image inspect "${IMAGE_REF}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
            versao=$(docker image inspect "${IMAGE_REF}" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')
            fornecedor=$(docker image inspect "${IMAGE_REF}" --format '{{ index .Config.Labels "org.opencontainers.image.vendor" }}')
            licenca=$(docker image inspect "${IMAGE_REF}" --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}')
            sistema=$(docker image inspect "${IMAGE_REF}" --format '{{ .Os }}')
            arquitetura=$(docker image inspect "${IMAGE_REF}" --format '{{ .Architecture }}')

            [ "${titulo}" = "${EXPECTED_TITLE}" ] || {
              echo "::error::${IMAGE_REF} tem title=${titulo}; esperado ${EXPECTED_TITLE}"
              exit 1
            }
            [ "${origem}" = "${IMAGE_SOURCE}" ] || {
              echo "::error::${IMAGE_REF} tem source=${origem}; esperado ${IMAGE_SOURCE}"
              exit 1
            }
            [ "${revisao}" = "${GITHUB_SHA}" ] || {
              echo "::error::${IMAGE_REF} tem revision=${revisao}; esperado ${GITHUB_SHA}"
              exit 1
            }
            [ "${versao}" = "${IMAGE_TAG}" ] || {
              echo "::error::${IMAGE_REF} tem version=${versao}; esperado ${IMAGE_TAG}"
              exit 1
            }
            [ "${fornecedor}" = "Promidia" ] || {
              echo "::error::${IMAGE_REF} tem vendor=${fornecedor}; esperado Promidia"
              exit 1
            }
            [ "${licenca}" = "MIT" ] || {
              echo "::error::${IMAGE_REF} tem licenses=${licenca}; esperado MIT"
              exit 1
            }
            [ "${sistema}" = "linux" ] || {
              echo "::error::${IMAGE_REF} tem os=${sistema}; esperado linux"
              exit 1
            }
            [ "${arquitetura}" = "amd64" ] || {
              echo "::error::${IMAGE_REF} tem arquitetura=${arquitetura}; esperado amd64"
              exit 1
            }

            echo "reutilizar=true" >> "${GITHUB_OUTPUT}"
            echo "reutilizada: ${IMAGE_REF}"
            exit 0
          fi

          # Somente ausencia inequivoca autoriza construir. Erro de rede,
          # permissao ou plataforma incompativel nunca pode virar sobrescrita.
          if grep -qiE 'manifest unknown|manifest[^:]*not found|not found: manifest|name unknown' <<<"${saida}"; then
            echo "reutilizar=false" >> "${GITHUB_OUTPUT}"
            echo "ausente: ${IMAGE_REF}"
            exit 0
          fi

          echo "${saida}"
          echo "::error::Nao foi possivel provar que ${IMAGE_REF} esta ausente ou compativel; abortando sem publicar."
          exit 1

      - name: Docker metadata (tag e labels OCI)
        id: meta
        if: steps.imagem-sha.outputs.reutilizar != 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.source=${{ env.IMAGE_SOURCE }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}

      - name: Set up Buildx
        if: steps.imagem-sha.outputs.reutilizar != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build e push quando a imagem SHA nao existe
        if: steps.imagem-sha.outputs.reutilizar != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ matrix.name == 'bb-gestao-app' && (github.event_name != 'push' || github.ref != 'refs/heads/main') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Na main, baixa a referencia canonica que acabou de ser publicada ou
      # reutilizada. Em PR/dispatch, o unico build do app ja fez load local.
      - name: Baixar a imagem SHA do app para smoke
        if: matrix.name == 'bb-gestao-app' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker pull --platform linux/amd64 "${IMAGE_NAMESPACE}/bb-gestao-app:${IMAGE_TAG}"

      - name: O container do app chega a servir?
        if: matrix.name == 'bb-gestao-app'
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 3000:3000 \
            -e NEXT_PUBLIC_SUPABASE_URL=https://exemplo.supabase.co \
            -e NEXT_PUBLIC_SUPABASE_ANON_KEY=chave-de-mentira \
            -e SUPABASE_SERVICE_ROLE_KEY=chave-de-mentira \
            -e SUPABASE_DB_URL=postgres://u:p@127.0.0.1:5432/postgres \
            -e SENTRY_DSN=off \
            "${IMAGE_NAMESPACE}/bb-gestao-app:${IMAGE_TAG}"

          pronto=nao
          for _ in $(seq 1 40); do
            if ! docker ps --filter name=smoke --filter status=running -q | grep -q .; then
              echo "::error::o container do app morreu durante o boot"
              docker logs smoke 2>&1 | tail -40
              exit 1
            fi
            if docker logs smoke 2>&1 | grep -qE "Ready in|started server on"; then
              pronto=sim
              break
            fi
            sleep 3
          done

          if [ "${pronto}" != "sim" ]; then
            echo "::error::o app nao chegou a servir em 120s"
            docker logs smoke 2>&1 | tail -40
            exit 1
          fi

          if docker logs smoke 2>&1 | grep -q "MODULE_NOT_FOUND"; then
            echo "::error::falta modulo no standalone"
            docker logs smoke 2>&1 | grep -A5 MODULE_NOT_FOUND | head -20
            exit 1
          fi

          docker logs smoke 2>&1 | grep -E "Ready in|Next.js" | head -3

      - name: Encerrar smoke
        if: ${{ always() && matrix.name == 'bb-gestao-app' }}
        run: docker rm -f smoke 2>/dev/null || true

  # Gate remoto do trio. Ele nao promove canal algum: apenas prova que as tres
  # tags existem no GHCR privado e carregam a identidade do mesmo SHA completo.
  validar-trio-sha:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR (leitura)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validar existencia e identidade do trio
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "push" ] || [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "execucao sem publicacao: validacao remota nao se aplica"
            exit 0
          fi

          for imagem in bb-gestao-app bb-gestao-worker bb-gestao-scheduler; do
            case "${imagem}" in
              bb-gestao-app) titulo_esperado="BB Gestão app" ;;
              bb-gestao-worker) titulo_esperado="BB Gestão worker" ;;
              bb-gestao-scheduler) titulo_esperado="BB Gestão scheduler" ;;
            esac

            ref="${IMAGE_NAMESPACE}/${imagem}:${IMAGE_TAG}"
            docker pull --platform linux/amd64 "${ref}"
            titulo=$(docker image inspect "${ref}" --format '{{ index .Config.Labels "org.opencontainers.image.title" }}')
            origem=$(docker image inspect "${ref}" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')
            revisao=$(docker image inspect "${ref}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
            versao=$(docker image inspect "${ref}" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')
            fornecedor=$(docker image inspect "${ref}" --format '{{ index .Config.Labels "org.opencontainers.image.vendor" }}')
            licenca=$(docker image inspect "${ref}" --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}')
            sistema=$(docker image inspect "${ref}" --format '{{ .Os }}')
            arquitetura=$(docker image inspect "${ref}" --format '{{ .Architecture }}')

            [ "${titulo}" = "${titulo_esperado}" ] || {
              echo "::error::${ref} tem title=${titulo}; esperado ${titulo_esperado}"
              exit 1
            }
            [ "${origem}" = "${IMAGE_SOURCE}" ] || {
              echo "::error::${ref} tem source=${origem}; esperado ${IMAGE_SOURCE}"
              exit 1
            }
            [ "${revisao}" = "${GITHUB_SHA}" ] || {
              echo "::error::${ref} tem revision=${revisao}; esperado ${GITHUB_SHA}"
              exit 1
            }
            [ "${versao}" = "${IMAGE_TAG}" ] || {
              echo "::error::${ref} tem version=${versao}; esperado ${IMAGE_TAG}"
              exit 1
            }
            [ "${fornecedor}" = "Promidia" ] || {
              echo "::error::${ref} tem vendor=${fornecedor}; esperado Promidia"
              exit 1
            }
            [ "${licenca}" = "MIT" ] || {
              echo "::error::${ref} tem licenses=${licenca}; esperado MIT"
              exit 1
            }
            [ "${sistema}" = "linux" ] || {
              echo "::error::${ref} tem os=${sistema}; esperado linux"
              exit 1
            }
            [ "${arquitetura}" = "amd64" ] || {
              echo "::error::${ref} tem arquitetura=${arquitetura}; esperado amd64"
              exit 1
            }
            echo "ok: ${ref} -> ${revisao} (${sistema}/${arquitetura})"
          done

  # Fachada unica disponivel para branch protection. No fork, ela ainda precisa
  # ser verificada e configurada externamente como required check.
  imagens-ok:
    if: always()
    needs: [build-and-push, validar-trio-sha]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Falhar se o trio nao foi integralmente validado
        run: |
          echo "build-and-push:   ${{ needs.build-and-push.result }}"
          echo "validar-trio-sha: ${{ needs.validar-trio-sha.result }}"
          [ "${{ needs.build-and-push.result }}" = "success" ]
          [ "${{ needs.validar-trio-sha.result }}" = "success" ]
